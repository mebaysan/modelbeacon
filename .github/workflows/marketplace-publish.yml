name: Release and publish extension

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: marketplace-mebaysan-modelbeacon
  cancel-in-progress: false
  queue: max

jobs:
  version:
    if: github.repository == 'mebaysan/modelbeacon' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Detect version upgrade and validate release identity
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node --experimental-strip-types scripts/release-version.mts

  publish:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      LLMBENCH_CATALOG_URL: ${{ vars.LLMBENCH_CATALOG_URL || 'https://mebaysan.github.io/modelbeacon/catalog/v2.json' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run catalog:check
      - run: npm test
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:ui
      - run: xvfb-run -a npm run test:extension
      - name: Package with images and links pinned to the release commit
        run: npm run package:release -- --githubBranch "$GITHUB_SHA"
      # GITHUB_TOKEN-created releases do not trigger another release workflow.
      - name: Create GitHub Release and attach VSIX (reuse the asset on retries)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: node --experimental-strip-types scripts/github-release.mts
      - uses: actions/upload-artifact@v4
        with:
          name: modelbeacon-marketplace
          path: modelbeacon.vsix
          if-no-files-found: error
      - name: Publish the tested VSIX
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          npx --no-install vsce publish --azure-credential --packagePath modelbeacon.vsix --skip-duplicate
